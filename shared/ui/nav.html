<!-- PILL NAV -->
<style>
[data-pn-wrap]{position:sticky;top:0;z-index:40;box-sizing:border-box;flex-shrink:0}
[data-pn] a,[data-pn] button{transition:background-color .15s cubic-bezier(.23,1,.32,1)}
[data-pn] a:hover{opacity:1}
[data-pn-item][data-on="false"]:hover,[data-pn-plain]:hover{background:rgba(127,127,127,.12)!important}
[data-pn-field]:focus-within{outline:2px solid currentColor;outline-offset:2px}
[data-pn] a:focus-visible,[data-pn] button:focus-visible,[data-pn-panel] button:focus-visible,[data-drawer] a:focus-visible,[data-drawer] button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (prefers-reduced-motion: reduce){[data-pn] a,[data-pn] button{transition:none}}
[data-dr-phone]{display:none!important}
@media (max-width: 759px){
[data-dr-phone]{display:flex!important}
[data-pn-items],[data-pn-back]{display:none!important}
[data-pn-logo]{margin-right:auto}
[data-pn]{padding:0 8px!important}
[data-pn-item]{padding:0 8px!important}
@media (max-width: 359px){[data-pn]{gap:0!important;padding:0 4px!important}[data-pn-items]{gap:0!important}[data-pn-item]{padding:0 5px!important}}
[data-pn-name],[data-pn-kbd]{display:none!important}
[data-drawer]{zoom:calc(1 / var(--fit, 1))}
[data-drawer] aside{width:min(360px,86vw)!important}
[data-daily]{zoom:calc(1 / var(--fit, 1))}
[data-pn-panel]{left:8px!important;right:8px!important;width:auto!important}
[data-pn-results]{max-height:55vh!important}
}
</style>
<div data-pn-wrap>
<nav aria-label="Main" data-pn style="height: 52px; box-sizing: border-box; padding: 0 24px; background: {{t.surface}}; border-bottom: 1px solid {{t.line}}; display: flex; align-items: center; gap: 8px; font-family: {{t.body}}; color: {{t.text}}">
<button data-pn-plain onClick="{{openDrawer}}" aria-label="Open menu" aria-expanded="{{drawerOpen}}" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 6px; border: 0; background: transparent; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<a href="Home.dc.html" data-pn-logo aria-label="DSAMaxxing home" style="height: 40px; padding: 0 8px 0 0; flex-shrink: 0; display: flex; align-items: center; gap: 8px; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="6" fill="{{t.accent}}"></rect><path d="M7.5 20.5 L11.5 10 L15 17 L18.5 10 L22.5 20.5" fill="none" stroke="{{t.onAccent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg><span data-pn-name style="font-size: var(--fs18); font-weight: 600; white-space: nowrap">DSAMaxxing</span></a>
<sc-if value="{{nav.back.show}}" hint-placeholder-val="{{ false }}"><button data-pn-plain data-pn-back onClick="{{nav.back.go}}" aria-label="{{nav.back.aria}}" title="{{nav.back.aria}}" style="height: 40px; padding: 0 8px; flex-shrink: 0; border-radius: 6px; border: 0; background: transparent; color: {{t.text}}; cursor: pointer; font-size: var(--fs16); white-space: nowrap">{{nav.back.label}}</button></sc-if>
<div data-pn-items style="flex-grow: 1; display: flex; align-items: center; gap: 4px; min-width: 0">
<sc-for list="{{nav.items}}" as="ni" hint-placeholder-count="2">
<a href="{{ni.href}}" aria-current="{{ni.current}}" data-pn-item data-on="{{ni.on}}" style="height: 40px; padding: 0 12px; border-radius: 6px; display: flex; align-items: center; font-size: var(--fs16); font-weight: 500; white-space: nowrap; background: {{ni.bg}}; color: {{ni.fg}}"><span data-pn-label>{{ni.label}}</span></a>
</sc-for>
</div>
<button data-pn-plain data-pn-search-btn onClick="{{nav.srch.show}}" aria-label="Search the site" aria-keyshortcuts="/" title="Search (press /)" style="height: 40px; padding: 0 8px; flex-shrink: 0; border-radius: 6px; border: 0; background: transparent; color: {{t.text}}; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{nav.srch.icon}}"></path></svg><span data-pn-kbd style="font-size: var(--fs16)">Search</span></button>
<a data-pn-plain href="Profile.dc.html" aria-label="Your profile" aria-current="{{nav.profileOn}}" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 6px; background: {{nav.avatarBg}}; color: {{nav.avatarFg}}; display: flex; align-items: center; justify-content: center; font-size: var(--fs16); font-weight: 600"><sc-if value="{{nav.hasName}}" hint-placeholder-val="{{ false }}">{{nav.initials}}</sc-if><sc-if value="{{nav.noName}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{nav.userIcon}}"></path></svg></sc-if></a>
</nav>
<sc-if value="{{nav.srch.open}}" hint-placeholder-val="{{ false }}">
<div onClick="{{nav.srch.hide}}" aria-hidden="true" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 41"></div>
<div data-pn-panel role="search" style="position: absolute; top: 4px; right: 24px; width: 480px; z-index: 42; display: flex; flex-direction: column; gap: 8px; font-family: {{t.body}}; color: {{t.text}}">
<div data-pn-field style="height: 44px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line2}}; box-shadow: 0 8px 24px {{t.shadow}}; display: flex; align-items: center; gap: 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{nav.srch.icon}}"></path></svg>
<input data-pn-search-input type="text" role="combobox" aria-label="Search the site" aria-expanded="{{nav.srch.expanded}}" aria-controls="pn-results" aria-autocomplete="list" aria-activedescendant="{{nav.srch.active}}" autocomplete="off" spellcheck="false" placeholder="Search lessons and problems" value="{{nav.srch.q}}" onChange="{{nav.srch.onInput}}" onKeyDown="{{nav.srch.onKey}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: {{t.text}}; font-family: {{t.body}}; font-size: var(--fs18)">
<button onClick="{{nav.srch.hide}}" aria-label="Close search" style="height: 32px; padding: 0 8px; flex-shrink: 0; border-radius: 8px; border: 1px solid {{t.line2}}; background: transparent; color: {{t.muted}}; font-family: {{t.mono}}; font-size: var(--fs15); cursor: pointer">Esc</button>
</div>
<div data-pn-results style="max-height: 480px; overflow-y: auto; box-sizing: border-box; padding: 8px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line2}}; box-shadow: 0 8px 24px {{t.shadow}}">
<sc-if value="{{nav.srch.hasHint}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; padding: 8px 12px; font-size: var(--fs16); line-height: 1.5; color: {{t.muted}}">{{nav.srch.hint}}, then press Enter.</p></sc-if>
<sc-if value="{{nav.srch.none}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 8px 12px; font-size: var(--fs16); line-height: 1.5; color: {{t.muted}}">No matches. Try a problem name, a pattern or a topic.</p></sc-if>
<div id="pn-results" role="listbox" aria-label="Search results">
<sc-for list="{{nav.srch.groups}}" as="pnsg" hint-placeholder-count="2">
<div role="group" aria-labelledby="{{pnsg.gid}}">
<div id="{{pnsg.gid}}" style="padding: 8px 12px 4px; font-size: var(--fs13); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.muted}}">{{pnsg.label}}</div>
<sc-for list="{{pnsg.items}}" as="pnsi" hint-placeholder-count="3">
<a href="{{pnsi.href}}" id="{{pnsi.id}}" role="option" aria-selected="{{pnsi.sel}}" tabindex="-1" onClick="{{pnsi.go}}" onMouseEnter="{{pnsi.hover}}" style="display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px; background: {{pnsi.bg}}; box-shadow: inset 3px 0 0 {{pnsi.bar}}"><span style="font-size: var(--fs17); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pnsi.title}}</span><span style="font-size: var(--fs15); color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pnsi.sub}}</span></a>
</sc-for>
</div>
</sc-for>
</div>
<div role="status" aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{nav.srch.status}}</div>
</div>
</div>
</sc-if>
</div>
<sc-if value="{{nav.daily.open}}" hint-placeholder-val="{{ false }}">
<div data-daily style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div onClick="{{nav.daily.close}}" aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.55)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="daily-h" aria-describedby="daily-p" onKeyDown="{{nav.daily.onKey}}" data-rise style="position: relative; width: 360px; max-width: 100%; box-sizing: border-box; padding: 24px; border-radius: 20px; border: 1px solid {{t.line2}}; background: {{t.surface}}; color: {{t.text}}; box-shadow: 0 16px 40px {{t.shadow}}; font-family: {{t.body}}; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<button onClick="{{nav.daily.close}}" aria-label="Close" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer; font-size: var(--fs18)">✕</button>
<svg width="44" height="44" viewBox="0 0 24 24" fill="{{nav.daily.flame}}" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-3 1.8-4.6 2.4-7.2C11 7.3 12 9 12 11c1-1.4 1-5 0-9z"></path></svg>
<h2 id="daily-h" style="margin: 0; font-family: {{t.display}}; font-size: var(--fs28); line-height: 1.1; font-weight: 600">{{nav.daily.title}}</h2>
<p id="daily-p" role="status" style="margin: 0; font-size: var(--fs18); line-height: 1.5; color: {{t.text2}}">{{nav.daily.body}}</p>
<sc-if value="{{nav.daily.isFreeze}}" hint-placeholder-val="{{ false }}"><button data-daily-go onClick="{{nav.daily.freeze}}" style="width: 100%; height: 48px; border: 0; border-radius: 24px; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer; font-size: var(--fs18); font-weight: 700">{{nav.daily.action}}</button></sc-if>
<sc-if value="{{nav.daily.isGo}}" hint-placeholder-val="{{ true }}"><a data-daily-go href="Code.dc.html" onClick="{{nav.daily.close}}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 24px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: var(--fs18); font-weight: 700">{{nav.daily.action}}</a></sc-if>
</div>
</div>
</sc-if>
DRAWER_HTML
<!-- /PILL NAV -->

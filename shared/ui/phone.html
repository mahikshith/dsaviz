<!-- PHONE CSS -->
<style>
/* Shared phone layout (shared/ui/phone.html, copied into every page's helmet by the build).
   A page opts in with data-fluid="true" data-page="Name" on its root div. Below 760px the runtime
   shows it at zoom 1 and sets html[data-phone]; these rules turn the 1440px board into one column.
   Everything sits inside the media query and keys off data attributes, so desktop is untouched.
   Per-element hooks, as space-separated words in data-m:
     pad   16px side gutters        col   flex row becomes a column   wrap  flex row wraps
     two   two-column grid          keep  grid keeps its desktop columns
     full  drop a fixed width       auto  drop a fixed height          hide  hidden on phones
     one / four  force one or four grid columns  g16 / g12 / g8  gap from the spacing scale
     p16  16px padding all round   scroll  sideways strip
   Grids collapse to one column on their own, except strips of 5 to 9 equal columns and tight
   segmented controls (gap 2px or 4px); four-up grids go two-up.
   Page-specific rules go in the page's own helmet, scoped with [data-page="Name"]; the automatic
   grid rules sit in :where() so any page rule beats them. */
@media (max-width: 759px){
[data-page]{width:100%!important;height:auto!important;min-height:100vh;overflow-x:clip}
/* Pages with their own 420px phone layout (data-fit, from their L values) also show at real size. */
[data-fit][data-fluid]{width:100%!important}
[data-fit][data-fluid] [style*="font-size: 10px"],[data-fit][data-fluid] [style*="font-size: 11px"]{font-size:12px!important}
[data-page] *{max-width:100%}
[data-page] main,[data-page] [data-m~="pad"]{padding-left:16px!important;padding-right:16px!important}
[data-page]:where([style*="grid-template-columns"]),[data-page] :where([style*="grid-template-columns"]:not([data-m~="keep"]):not([style*="gap: 2px"]):not([style*="gap: 4px"]):not([data-drawer] *):not([data-m~="two"]):not([style*="repeat(4,"]):not([style*="repeat(5,"]):not([style*="repeat(6,"]):not([style*="repeat(7,"]):not([style*="repeat(8,"]):not([style*="repeat(9,"])){grid-template-columns:minmax(0,1fr)!important}
[data-page] [data-m~="one"]{grid-template-columns:minmax(0,1fr)!important}
[data-page] [data-m~="four"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
/* Sections drop their board heights; title rows with a side note or link stack. */
[data-page] section,[data-page] main{height:auto!important}
[data-page] [style*="justify-content: space-between"][style*="align-items: flex-end"]:not([data-m~="keep"]){flex-direction:column;align-items:flex-start!important;gap:12px!important}
[data-page] [style*="justify-content: space-between"][style*="align-items: baseline"]{flex-wrap:wrap;column-gap:12px;row-gap:4px}
/* Tab strips and code scroll sideways inside their box, never the page. */
[data-page] [role="tablist"]{overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none;align-self:stretch!important}
[data-page] [role="tablist"]>*{flex-shrink:0}
[data-page] pre,[data-page] [style*="white-space: pre;"]{overflow-x:auto}
[data-page] input,[data-page] textarea,[data-page] select{box-sizing:border-box;max-width:100%!important}
[data-page] label:has(select){flex:1 1 100%;min-width:0}
[data-page] label select{flex:1 1 auto;min-width:0;width:auto!important}
/* Day, week and path strips (5 to 9 equal columns) keep their columns; four-up tiles go two-up. */
[data-page] :where([style*="grid-template-columns: repeat(4,"]:not([data-m~="keep"]):not([data-drawer] *)),[data-page] [data-m~="two"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
/* Big board paddings, generated by scripts/build_pages.py from the pages' markup. */
/*@@PADS@@*/
[data-page] [data-m~="col"]{flex-direction:column!important;align-items:stretch!important}
[data-page] [data-m~="wrap"]{flex-wrap:wrap!important}
[data-page] [data-m~="hide"]{display:none!important}
[data-page] [data-m~="full"]{width:auto!important;min-width:0!important;flex-basis:auto!important}
[data-page] [data-m~="auto"]{height:auto!important;min-height:0!important}
[data-page] [data-m~="g16"]{gap:16px!important}
[data-page] [data-m~="g12"]{gap:12px!important}
[data-page] [data-m~="g8"]{gap:8px!important}
[data-page] [data-m~="p16"]{padding:16px!important}
[data-page] [data-m~="scroll"]{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
[data-page] [data-m~="scroll"]>*{flex-shrink:0}
[data-page] svg,[data-page] img,[data-page] pre,[data-page] table{max-width:100%}
/* Display type at phone size. */
[data-page] h1{font-size:36px!important;line-height:1.08!important}
[data-page] [style*="font-size: 34px"],[data-page] [style*="font-size: 36px"]{font-size:28px!important;line-height:1.15!important}
[data-page] [style*="font-size: 4"]:not([style*="font-size: 4px"]){font-size:32px!important;line-height:1.1!important}
[data-page] [style*="font-size: 5"]:not([style*="font-size: 5px"]){font-size:36px!important;line-height:1.08!important}
[data-page] [style*="font-size: 7"]:not([style*="font-size: 7px"]){font-size:44px!important;line-height:1.05!important}
[data-page] [style*="font-size: 180px"]{font-size:96px!important;line-height:1!important}
/* Nothing under 12px. */
[data-page] [style*="font-size: 9px"],[data-page] [style*="font-size: 10px"],[data-page] [style*="font-size: 11px"]{font-size:12px!important}
/* 44px touch targets. */
[data-page] [role="checkbox"]{position:relative}
[data-page] [role="checkbox"]::after{content:"";position:absolute;inset:-10px}
[data-page] button:not([data-m~="keep"]):not([role="checkbox"]),[data-page] select,[data-page] input:not([type="checkbox"]):not([type="radio"]):not([type="range"]){min-height:44px!important}
[data-page] button:not([data-m~="keep"]):not([role="checkbox"]){min-width:44px}
[data-page] a[style^="height:"],[data-page] a[style*="; height:"],[data-page] a[style*="min-height:"]{min-height:44px;height:auto!important}
}
</style>
<!-- /PHONE CSS -->

<!-- TOUR -->
<style>
[data-tour-root]{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:80;pointer-events:none;zoom:calc(1 / var(--fit, 1));font-family:var(--tour-font,inherit)}
[data-tour-root][hidden]{display:none}
[data-tour-spot]{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px var(--tour-dim,rgba(0,0,0,.6)),0 0 0 2px var(--tour-ring,#C5F04A);pointer-events:none;transition:top .22s ease-out,left .22s ease-out,width .22s ease-out,height .22s ease-out,opacity .16s}
[data-tour-spot][data-none]{opacity:0}
[data-tour-card]{position:fixed;box-sizing:border-box;width:340px;max-width:calc(100vw - 32px);padding:20px;border-radius:16px;background:var(--tour-surface,#151518);color:var(--tour-text,#F5F5F7);border:1px solid var(--tour-line,#34343C);box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:16px;pointer-events:auto;transition:top .22s ease-out,left .22s ease-out}
[data-tour-card]:focus{outline:none}
[data-tour-count]{font-size:15px;line-height:24px;font-weight:500;color:var(--tour-muted,#8E8E93)}
[data-tour-text]{margin:0;font-size:18px;line-height:28px}
[data-tour-row]{display:flex;align-items:center;gap:8px}
[data-tour-row] button{height:44px;padding:0 16px;box-sizing:border-box;border-radius:12px;border:0;cursor:pointer;font:inherit;font-size:16px;font-weight:600;background:transparent;color:var(--tour-muted,#8E8E93);transition:transform .12s,background-color .15s}
[data-tour-row] button:active{transform:scale(.97)}
[data-tour-row] button:hover{background:rgba(127,127,127,.14)}
[data-tour-row] button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
[data-tour-row] [data-tour-next]{margin-left:auto;padding:0 24px;background:var(--tour-accent,#C5F04A);color:var(--tour-on,#0A0A0B)}
[data-tour-row] [data-tour-next]:hover{background:var(--tour-accent,#C5F04A);filter:brightness(1.06)}
@media (prefers-reduced-motion: reduce){[data-tour-spot],[data-tour-card],[data-tour-row] button{transition:none}}
</style>
<div data-tour-root hidden>
<div data-tour-spot data-none aria-hidden="true"></div>
<div data-tour-card role="dialog" aria-label="Site tour" tabindex="-1">
<span data-tour-count></span>
<p data-tour-text aria-live="polite"></p>
<div data-tour-row>
<button type="button" data-tour-skip>Skip</button>
<button type="button" data-tour-back>Back</button>
<button type="button" data-tour-next>Next</button>
</div>
</div>
</div>
<!-- /TOUR -->

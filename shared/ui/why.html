<!-- WHY -->
<sc-if value="{{why.has}}" hint-placeholder-val="{{ true }}">
<details data-why style="position: relative; margin: -8px 0; min-width: 0; align-self: flex-start; max-width: 100%">
<style>
[data-why]>summary{list-style:none;cursor:pointer}
[data-why]>summary::-webkit-details-marker{display:none}
[data-why]>summary:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:999px}
[data-why] .why-chev{transition:transform .16s ease-out}
[data-why][open] .why-chev{transform:rotate(180deg)}
.pp-top [data-why] .why-body{position:absolute;top:100%;left:0;z-index:40;width:360px;max-width:calc(100vw - 32px);margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>
<summary class="ds-hit" style="min-height: 44px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; color: {{t.muted}}; font-size: var(--fs16); font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>Why learn this?<svg class="why-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></summary>
<div class="why-body" style="box-sizing: border-box; max-width: 720px; padding: 16px; border-radius: 12px; background: {{t.sunk}}; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: var(--fs17); line-height: 1.5; color: {{t.text}}">{{why.does}}</p>
<sc-if value="{{why.hasWhere}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: var(--fs16); font-weight: 600; color: {{t.muted}}">Where it shows up</span>
<ul style="margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs17); line-height: 1.5; color: {{t.text2}}"><sc-for list="{{why.where}}" as="wh" hint-placeholder-count="2"><li>{{wh.text}}</li></sc-for></ul></div></sc-if>
</div>
</details>
</sc-if>
<!-- /WHY -->
